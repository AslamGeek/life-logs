<script>
const state = {activities:[],events:[],page:'dashboard',historyLimit:30,searchTimer:null};
const $ = id => document.getElementById(id);
const call = (method,...args) => new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[method](...args));
function localDateInput(date=new Date()){const p=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`}
function dateLabel(iso,opts={month:'short',day:'numeric',year:'numeric'}){const d=new Date(iso);return Number.isNaN(d.getTime())?'Unknown date':new Intl.DateTimeFormat(undefined,opts).format(d)}
function elapsed(iso){const days=Math.floor((Date.now()-new Date(iso).getTime())/86400000);if(days<0)return 'Scheduled';if(days===0)return 'Today';if(days===1)return '1 day ago';if(days<30)return `${days} days ago`;const months=Math.floor(days/30);if(months===1)return '1 month ago';if(months<12)return `${months} months ago`;const years=Math.floor(days/365);return years===1?'1 year ago':`${years} years ago`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(message,error=false){const t=$('toast');t.textContent=message;t.className='toast show'+(error?' error':'');setTimeout(()=>t.className='toast',2800)}
function setSync(message,error=false){$('sync-text').textContent=message;$('sync-text').previousElementSibling.classList.toggle('error',error)}
async function refresh(){setSync('Syncing with your Google Sheet…');$('refresh').disabled=true;try{const data=await call('getAppData');state.activities=data.activities;state.events=data.events;renderAll();const stamp=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(data.syncedAt));setSync(`Synced just now · ${stamp}`);$('footer-sync').textContent=`Private · ${esc(data.spreadsheetName)} · synced ${stamp}`}catch(e){setSync(e.message,true);showToast(e.message,true)}finally{$('refresh').disabled=false}}
function latestFor(a){return state.events.filter(e=>e.activityId===a.id).sort((x,y)=>y.occurredAt.localeCompare(x.occurredAt))[0]}
function renderAll(){renderDashboard();renderFilters();renderHistory();renderActivities();renderActivityOptions()}
function renderDashboard(){const now=new Date(),month=now.getMonth(),year=now.getFullYear();$('month-count').textContent=state.events.filter(e=>{const d=new Date(e.occurredAt);return d.getMonth()===month&&d.getFullYear()===year}).length;$('activity-count').textContent=state.activities.filter(a=>!a.archived).length;const newest=state.events[0];$('recent-activity').textContent=newest?newest.activityName:'—';$('recent-when').textContent=newest?`${elapsed(newest.occurredAt)} · ${dateLabel(newest.occurredAt,{month:'short',day:'numeric'})}`:'Your latest moment';const active=state.activities.filter(a=>!a.archived).map(a=>({...a,last:latestFor(a),count:state.events.filter(e=>e.activityId===a.id).length})).sort((a,b)=>b.count-a.count||(b.last?.occurredAt||'').localeCompare(a.last?.occurredAt||''));$('routine-list').innerHTML=active.length?active.map(a=>`<button class="routine-card" data-history="${esc(a.id)}"><span class="routine-top"><span class="routine-name">${esc(a.name)}</span><span class="routine-icon">↗</span></span><span class="routine-when">${a.last?`${esc(elapsed(a.last.occurredAt))} · ${dateLabel(a.last.occurredAt,{month:'short',day:'numeric'})}`:'No events yet'} · ${a.count} ${a.count===1?'entry':'entries'}</span>${a.category?`<span class="routine-category">${esc(a.category)}</span>`:''}</button>`).join(''):`<div class="empty" style="grid-column:1/-1"><strong>Your routine starts here.</strong>Add an activity, then log the little moments you want to remember.</div>`;const recent=state.events.slice(0,5);$('recent-list').innerHTML=recent.length?recent.map(eventRow).join(''):`<div class="empty"><strong>No moments logged yet.</strong>Your first entry can be anything at all.</div>`}
function eventRow(e){const d=new Date(e.occurredAt),label=dateLabel(e.occurredAt,{month:'short',day:'numeric',year:'numeric'});return `<div class="event-row"><div class="event-date">${esc(label)}<br>${esc(new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d))}</div><div><div class="event-title">${esc(e.activityName)} <span style="font-weight:400;color:#8b968f">· ${esc(elapsed(e.occurredAt))}</span></div>${e.notes?`<div class="event-notes">${esc(e.notes)}</div>`:''}</div>${e.tags?.length?`<span class="event-tag">${esc(e.tags[0])}${e.tags.length>1?` +${e.tags.length-1}`:''}</span>`:'<span></span>'}<div class="event-actions"><button class="small-button" data-edit-event="${esc(e.id)}">Edit</button><button class="small-button" data-delete-event="${esc(e.id)}">Delete</button></div></div>`}
function renderFilters(){const a=$('activity-filter').value,c=$('category-filter').value,t=$('tag-filter').value;const activities=[...new Map(state.activities.map(x=>[x.id,x])).values()];$('activity-filter').innerHTML='<option value="">All activities</option>'+activities.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('activity-filter').value=a;const cats=[...new Set(state.activities.map(x=>x.category).filter(Boolean))].sort();$('category-filter').innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');$('category-filter').value=c;const tags=[...new Set(state.events.flatMap(x=>x.tags||[]))].sort();$('tag-filter').innerHTML='<option value="">All tags</option>'+tags.map(x=>`<option>${esc(x)}</option>`).join('');$('tag-filter').value=t}
function renderHistory(){const query=$('search').value.trim().toLowerCase(),activity=$('activity-filter').value,category=$('category-filter').value,tag=$('tag-filter').value,from=$('date-from').value,to=$('date-to').value,oldest=$('sort-filter').value==='oldest';let rows=state.events.filter(e=>{const a=state.activities.find(x=>x.id===e.activityId),d=new Date(e.occurredAt),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return(!activity||e.activityId===activity)&&(!category||a?.category===category)&&(!tag||(e.tags||[]).includes(tag))&&(!from||key>=from)&&(!to||key<=to)&&(!query||`${e.activityName} ${e.notes} ${(e.tags||[]).join(' ')}`.toLowerCase().includes(query))});if(oldest)rows.reverse();const shown=rows.slice(0,state.historyLimit);$('history-list').innerHTML=shown.length?shown.map(eventRow).join(''):`<div class="empty"><strong>Nothing matched that search.</strong>Try another word or clear a filter.</div>`;$('load-more').classList.toggle('hidden',shown.length>=rows.length)}
function renderActivities(){const list=state.activities;$('activity-library').innerHTML=list.length?list.map(a=>{const last=latestFor(a);return `<article class="activity-card"><div class="activity-main"><div class="activity-name">${esc(a.name)} ${a.archived?'<span class="archived-badge">Archived</span>':''}</div><div class="activity-meta">${esc(a.category||'Uncategorized')} · ${state.events.filter(e=>e.activityId===a.id).length} entries${a.reminderDays?` · every ${a.reminderDays} days`:''}</div><div class="activity-last">${last?`Last: ${esc(dateLabel(last.occurredAt))} (${esc(elapsed(last.occurredAt))})`:'No events yet'}</div></div><div class="activity-actions"><button class="small-button" data-history="${esc(a.id)}">History</button><button class="small-button" data-edit-activity="${esc(a.id)}">Edit</button><button class="small-button" data-archive="${esc(a.id)}">${a.archived?'Restore':'Archive'}</button></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1"><strong>No activities yet.</strong>Create the first one — anything you want to keep track of.</div>`}
function renderActivityOptions(selected=''){const active=state.activities.filter(a=>!a.archived);$('event-activity').innerHTML='<option value="">Choose an activity…</option>'+active.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');if(selected)$('event-activity').value=selected;$('quick-activities').innerHTML=active.slice(0,5).map(a=>`<button type="button" class="quick-chip" data-quick="${esc(a.id)}">${esc(a.name)}</button>`).join('')+`<button type="button" class="quick-chip" data-new-inline="1">＋ New</button>`}
function openEvent(event=null,activityId=''){if(!state.activities.some(a=>!a.archived)){$('activity-dialog').showModal();return} $('event-form').reset();$('event-error').textContent='';$('event-id').value=event?.id||'';$('event-dialog-title').textContent=event?'Edit event':'Log an event';$('event-date').value=event?localDateInput(new Date(event.occurredAt)):localDateInput();$('event-notes').value=event?.notes||'';$('event-tags').value=(event?.tags||[]).join(', ');renderActivityOptions(event?.activityId||activityId);$('event-dialog').showModal()}
function openActivity(activity=null){$('activity-form').reset();$('activity-error').textContent='';$('activity-id').value=activity?.id||'';$('activity-dialog-title').textContent=activity?'Edit activity':'New activity';$('activity-name').value=activity?.name||'';$('activity-category').value=activity?.category||'';$('activity-tags').value=(activity?.tags||[]).join(', ');$('activity-reminder').value=activity?.reminderDays||'';$('activity-dialog').showModal()}
document.addEventListener('click',async e=>{const page=e.target.closest('[data-page]')?.dataset.page;if(page){state.page=page;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(`${page}-page`).classList.remove('hidden');document.querySelectorAll('.nav-link').forEach(x=>x.classList.toggle('active',x.dataset.page===page));history.replaceState(null,'',`#${page}`)}if(e.target.closest('[data-go]'))document.querySelector(`[data-page="${e.target.closest('[data-go]').dataset.go}"]`).click();if(e.target.closest('#open-add,#hero-add'))openEvent();if(e.target.closest('#new-activity'))openActivity();if(e.target.closest('.close-dialog'))e.target.closest('dialog').close();const quick=e.target.closest('[data-quick]');if(quick)$('event-activity').value=quick.dataset.quick;if(e.target.closest('[data-new-inline]')){ $('event-dialog').close();openActivity() }const hist=e.target.closest('[data-history]');if(hist){$('activity-filter').value=hist.dataset.history;document.querySelector('[data-page="history"]').click();renderHistory()}const editA=e.target.closest('[data-edit-activity]');if(editA)openActivity(state.activities.find(a=>a.id===editA.dataset.editActivity));const archive=e.target.closest('[data-archive]');if(archive){const a=state.activities.find(x=>x.id===archive.dataset.archive);try{await call('saveActivity',{...a,archived:!a.archived});await refresh();showToast(a.archived?'Activity restored':'Activity archived')}catch(err){showToast(err.message,true)}}const editE=e.target.closest('[data-edit-event]');if(editE)openEvent(state.events.find(x=>x.id===editE.dataset.editEvent));const del=e.target.closest('[data-delete-event]');if(del){const item=state.events.find(x=>x.id===del.dataset.deleteEvent);if(item&&confirm(`Delete the “${item.activityName}” event from ${dateLabel(item.occurredAt)}? This cannot be undone.`)){try{await call('deleteEvent',item.id);await refresh();showToast('Event deleted')}catch(err){showToast(err.message,true)}}}});
document.querySelectorAll('.nav-link').forEach(x=>x.addEventListener('click',()=>{state.page=x.dataset.page;document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(`${state.page}-page`).classList.remove('hidden');document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('active',n===x));history.replaceState(null,'',`#${state.page}`)}));
$('event-form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('save-event');btn.disabled=true;$('event-error').textContent='';const id=$('event-id').value||crypto.randomUUID();$('event-id').value=id;try{await call('saveEvent',{id,activityId:$('event-activity').value,occurredAt:new Date($('event-date').value).toISOString(),notes:$('event-notes').value,tags:$('event-tags').value});$('event-dialog').close();await refresh();showToast('Event saved to your Google Sheet')}catch(err){$('event-error').textContent=err.message;btn.disabled=false}finally{btn.disabled=false}});
$('activity-form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('save-activity');btn.disabled=true;$('activity-error').textContent='';try{await call('saveActivity',{id:$('activity-id').value||crypto.randomUUID(),name:$('activity-name').value,category:$('activity-category').value,tags:$('activity-tags').value,reminderDays:$('activity-reminder').value});$('activity-dialog').close();await refresh();showToast('Activity saved')}catch(err){$('activity-error').textContent=err.message}finally{btn.disabled=false}});
['search','activity-filter','category-filter','tag-filter','date-from','date-to','sort-filter'].forEach(id=>$(id).addEventListener('input',()=>{state.historyLimit=30;renderHistory()}));$('load-more').addEventListener('click',()=>{state.historyLimit+=30;renderHistory()});$('refresh').addEventListener('click',refresh);window.addEventListener('load',()=>{if(location.hash==='#history'||location.hash==='#activities')document.querySelector(`[data-page="${location.hash.slice(1)}"]`).click();refresh()});
</script>
